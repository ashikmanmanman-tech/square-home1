name: square_home
description: >
  Windows Phone "Live Tiles" style mobile launcher. Flutter rewrite of the
  original Expo/React Native "Square Home" app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management + persistence
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.4.0

  # Live tile data sources (all real device/network data, no mocks)
  http: ^1.2.1                 # Weather (open-meteo.com)
  geolocator: ^11.0.0          # Maps + Weather location
  geocoding: ^3.0.0            # Reverse geocode lat/lng -> city/region
  flutter_contacts: ^1.1.9+2   # Contacts live tile
  device_calendar: ^4.3.2      # Calendar live tile
  photo_manager: ^3.2.3        # Gallery live tile
  video_player: ^2.9.1         # "Now playing" style video tile
  permission_handler: ^11.3.1  # Runtime permission prompts
  battery_plus: ^6.0.2         # Battery live tile (real device battery level/state)

  # Icons
  font_awesome_flutter: ^10.7.0  # Real brand/social logos
  intl: ^0.19.0                  # Date/time formatting for Clock/Calendar

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
